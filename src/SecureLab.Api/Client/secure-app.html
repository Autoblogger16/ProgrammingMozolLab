<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>ЛР 03 — захищений сценарій</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 24px auto;
            padding: 0 16px;
        }

        fieldset {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin: 6px 0;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Трекер інцидентів: захищений сценарій</h1>

    <!-- Стан сеансу: показується лише один із трьох рядків -->
    <p id="anonymous" class="status" hidden>Стан: не ввійшли.</p>
    <p id="signed-in" class="status" hidden>Стан: сеанс активний.</p>
    <p id="unknown" class="status">Стан: ще не перевірено.</p>

    <fieldset>
        <legend>1. Реєстрація</legend>
        <form id="register">
            <label>Ім’я користувача <input name="userName" required></label>
            <label>Email <input name="email" type="email" required></label>
            <label>Відображуване ім’я <input name="displayName" required></label>
            <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
            <button>Зареєструватися</button>
        </form>
    </fieldset>

    <fieldset>
        <legend>2. Вхід</legend>
        <form id="login">
            <label>Ім’я користувача <input name="userName" autocomplete="username" required></label>
            <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
            <button>Увійти</button>
        </form>
    </fieldset>

    <fieldset>
        <legend>3. Мій профіль</legend>
        <dl id="profile" hidden>
            <dt>Id</dt>
            <dd id="profile-id"></dd>
            <dt>Ім’я користувача</dt>
            <dd id="profile-username"></dd>
            <dt>Роль</dt>
            <dd id="profile-role"></dd>
        </dl>
    </fieldset>

    <fieldset>
        <legend>4. Новий інцидент</legend>
        <form id="incident">
            <label>Заголовок <input name="title" required></label>
            <label>Опис <input name="description" required></label>
            <label>
                Критичність
                <select name="severity">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                    <option>Critical</option>
                </select>
            </label>
            <label>Час події <input name="occurredAtUtc" type="datetime-local" required></label>
            <button>Створити</button>
        </form>
        <p id="incident-result"></p>
    </fieldset>

    <fieldset>
        <legend>5. Вихід</legend>
        <button id="logout" type="button">Вийти</button>
    </fieldset>

    <p id="result" role="status"></p>
    <script type="module" src="./secure-app.js"></script>
</body>
</html>
